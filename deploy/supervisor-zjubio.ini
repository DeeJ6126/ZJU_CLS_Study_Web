[program:zjubio-node]
command=/bin/sh /var/www/html/zjubio/scripts/run-production-server.sh
directory=/var/www/html/zjubio
user=zjubio_run
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=NODE_ENV="production",ZJUBIO_ENV_FILE="/etc/zjubio/zjubio.env",PATH="/opt/zjubio/node/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/www/html/zjubio/log/node.log
stderr_logfile=/var/www/html/zjubio/log/node.err
