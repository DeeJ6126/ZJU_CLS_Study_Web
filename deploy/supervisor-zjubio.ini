[program:zjubio-node]
command=/opt/zjubio/node/bin/node --env-file=/etc/zjubio/zjubio.env /var/www/html/zjubio/server/server.js
directory=/var/www/html/zjubio
user=zjubio_run
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
environment=NODE_ENV="production",PATH="/opt/zjubio/node/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/www/html/zjubio/log/node.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/zjubio/log/node.err
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:zjubio-backup]
command=/opt/zjubio/node/bin/node --env-file=/etc/zjubio/zjubio.env /var/www/html/zjubio/scripts/backup-scheduler.mjs
directory=/var/www/html/zjubio
user=zjubio_run
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
environment=NODE_ENV="production",PATH="/opt/zjubio/node/bin:/usr/local/bin:/usr/bin:/bin"
stdout_logfile=/var/www/html/zjubio/log/backup.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=5
stderr_logfile=/var/www/html/zjubio/log/backup.err
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=5
