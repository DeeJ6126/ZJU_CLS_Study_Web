<VirtualHost *:80>
    ServerName bis.zju.edu.cn
    ServerAlias 10.71.115.70

    DocumentRoot /var/www/html
    ProxyPreserveHost On

    RedirectMatch 301 ^/$ /zjubio/
    RedirectMatch 301 ^/(zjubio|cellanalyst)$ /$1/

    # Keep the application API private behind Apache and on the same origin as
    # the browser. mod_proxy automatically appends X-Forwarded-For; the outer
    # HTTPS gateway's X-Forwarded-Proto header is passed through unchanged.
    ProxyPass        /api/ http://127.0.0.1:5175/api/ retry=0 timeout=60
    ProxyPassReverse /api/ http://127.0.0.1:5175/api/

    Alias /zjubio/ /var/www/html/zjubio/dist/
    <Directory /var/www/html/zjubio/dist/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        FallbackResource /zjubio/index.html
    </Directory>

    <Directory /var/www/html/cellanalyst/>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Defence in depth for the three v-html render paths (comments and UBB
    # article bodies). Report-Only first: it changes nothing for users but
    # surfaces what a real policy would block. Review the reports, then drop
    # the -Report-Only suffix to enforce.
    #
    # 'unsafe-inline' for style-src is required by Vue's scoped styles and the
    # inline style attributes the UBB renderer emits ([color]/[align]).
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/zjubio_error.log
    CustomLog ${APACHE_LOG_DIR}/zjubio_access.log combined
</VirtualHost>
